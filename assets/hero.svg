<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Chris Gluphony — desarrollador full stack</title>
  <desc id="desc">Cabecera oscura con tipografía grande, un motivo orbital y los temas web, API y datos.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111d"/>
      <stop offset="0.55" stop-color="#101a2b"/>
      <stop offset="1" stop-color="#0b2531"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#5be3d3" stop-opacity=".24"/>
      <stop offset="1" stop-color="#5be3d3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f0df77"/>
      <stop offset="1" stop-color="#77e4d3"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#88c7d2" stroke-opacity=".075" stroke-width="1"/>
    </pattern>
    <clipPath id="round"><rect width="1200" height="430" rx="24"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="430" fill="url(#bg)"/>
    <rect width="1200" height="430" fill="url(#grid)"/>
    <circle cx="954" cy="215" r="335" fill="url(#halo)"/>
    <path d="M0 374 C210 325 394 426 574 391 S994 321 1200 374" fill="none" stroke="#78decf" stroke-opacity=".16" stroke-width="2"/>
    <path d="M0 392 C190 356 416 438 612 410 S990 348 1200 390" fill="none" stroke="#f0df77" stroke-opacity=".15" stroke-width="2"/>

    <g transform="translate(58 38)">
      <circle cx="8" cy="8" r="5" fill="#f0df77"/>
      <circle cx="28" cy="8" r="5" fill="#78decf"/>
      <circle cx="48" cy="8" r="5" fill="#6a7b93"/>
      <text x="78" y="13" font-family="Consolas, monospace" font-size="15" fill="#9db4c6" letter-spacing="2">GLUPHONY / PORTFOLIO</text>
    </g>

    <g font-family="Segoe UI, Arial, sans-serif">
      <text x="60" y="139" fill="#9db4c6" font-size="25" font-weight="700" letter-spacing="7">HOLA, SOY</text>
      <text x="54" y="232" fill="#f4f7fa" font-size="91" font-weight="800" letter-spacing="-3">CHRIS</text>
      <text x="54" y="324" fill="url(#accent)" font-size="82" font-weight="800" letter-spacing="-3">GLUPHONY</text>
      <text x="60" y="372" fill="#c7d6df" font-size="22" letter-spacing="2">DESARROLLO FULL STACK  /  WEB + IA + PRODUCTO</text>
    </g>

    <g transform="translate(954 218)" fill="none" stroke-linecap="round">
      <circle r="155" stroke="#6fc8c3" stroke-opacity=".19" stroke-width="1.5"/>
      <circle r="112" stroke="#f0df77" stroke-opacity=".31" stroke-width="1.5"/>
      <circle r="69" stroke="#71e5d3" stroke-opacity=".42" stroke-width="1.5"/>
      <path d="M-178 0 H178 M0-178 V178" stroke="#81c6cb" stroke-opacity=".13" stroke-width="1"/>
      <path d="M-100-52 L-48 43 L70-29 L132 72" stroke="#75ddcf" stroke-opacity=".8" stroke-width="3"/>
      <circle cx="-100" cy="-52" r="7" fill="#f0df77" stroke="none"/>
      <circle cx="-48" cy="43" r="7" fill="#76e1d2" stroke="none"/>
      <circle cx="70" cy="-29" r="7" fill="#f0df77" stroke="none"/>
      <circle cx="132" cy="72" r="7" fill="#76e1d2" stroke="none"/>
      <rect x="-58" y="-21" width="116" height="42" rx="10" fill="#0e2731" stroke="#74dbd0" stroke-opacity=".65"/>
      <text x="0" y="8" text-anchor="middle" fill="#f3f7f8" stroke="none" font-family="Consolas, monospace" font-size="21" font-weight="700">&lt;/&gt;</text>
    </g>
    <g font-family="Consolas, monospace" font-size="16" font-weight="700">
      <text x="766" y="135" fill="#f0df77">WEB</text>
      <text x="1060" y="122" fill="#78decf">API</text>
      <text x="1063" y="342" fill="#f0df77">DATA</text>
    </g>
    <rect x="0" y="414" width="1200" height="16" fill="url(#accent)" opacity=".82"/>
  </g>
</svg>
